<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Intelligence Portal - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #93e49e 0%, #71d67e 100%), url('https://images.unsplash.com/photo-1519821172144-4f87d85de2a1') no-repeat center center/cover;
            background-blend-mode: multiply;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 50px;
            width: 350px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s, background 0.3s;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
            font-weight: 500;
        }

        .credential-hints {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }
        .credential-hints p { margin: 5px 0; }
        .credential-hints code { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; color: #00c6ff; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Portal Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Sign In</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="credential-hints">
            <p><strong>Available accounts:</strong></p>
            <p>User: <code>fireadmin</code> / Pass: <code>admin</code><br> <em>(Redirects to Fire Intelligence)</em></p>
            <p>User: <code>forestadmin</code> / Pass: <code>admin</code><br> <em>(Redirects to Forest AI)</em></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (user === 'fireadmin' && pass === 'admin') {
                errorDiv.textContent = "";
                window.location.href = "/fire";
            } else if (user === 'forestadmin' && pass === 'admin') {
                errorDiv.textContent = "";
                const currentHost = window.location.hostname;
                window.location.href = `http://${currentHost}:8002/`;
            } else {
                errorDiv.textContent = "Invalid username or password.";
            }
        });
    </script>
</body>
</html>
